version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: postgres_local
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 820414Got
      POSTGRES_DB: JWTAuthApi

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


    healthcheck:
     test: ["CMD-SHELL", "pg_isready -U postgres -d JWTAuthApi"]
     interval: 10s
     timeout: 5s
     retries: 5


  app:
    build:
      context: .

    container_name: spring_app
    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/JWTAuthApi
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 820416Got



volumes:
  postgres_data:
