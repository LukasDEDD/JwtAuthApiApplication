name: Trigger auto deployment for jwtauthapi

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/jwtauthapi-AutoDeployTrigger-4f0bd95e-a582-41c7-8e1c-fbe66af46977.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.JWTAUTHAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.JWTAUTHAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.JWTAUTHAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: lukasjwt.azurecr.io
          registryUsername: ${{ secrets.JWTAUTHAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.JWTAUTHAPI_REGISTRY_PASSWORD }}
          containerAppName: jwtauthapi
          resourceGroup: JWTAuthApi
          imageToBuild: lukasjwt.azurecr.io/jwtauthapi:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


