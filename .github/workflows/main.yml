name: Java CI Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: JwtAuthApiApplication
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d JwtAuthApiApplication"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Test
        working-directory: ./JwtAuthApiApplication
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/JwtAuthApiApplication
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn clean verify

      - name: SpotBugs scan
        working-directory: ./JwtAuthApiApplication
        run: mvn spotbugs:spotbugs


      - name: Azure Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      - name: Log in to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          az acr login --name lukasjwt


      - name: Build Docker image
        working-directory: ./JwtAuthApiApplication
        run: docker build -t lukasjwt.azurecr.io/jwt-app:${{ github.sha }} .


      - name: Push image to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker push lukasjwt.azurecr.io/jwt-app:${{ github.sha }}


      - name: Deploy Container App
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: jwtauthapi
          resourceGroup: JWTAuthApi
          imageToDeploy: lukasjwt.azurecr.io/jwt-app:${{ github.sha }}
